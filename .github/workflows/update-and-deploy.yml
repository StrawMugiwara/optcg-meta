name: Actualizar datos y publicar

# - Cada día (y con «Run workflow»): descarga datos y precios nuevos, construye y publica (unos 5-25 min).
# - En cada push de código: reutiliza los últimos datos descargados (caché), construye y publica (1-2 min).

on:
  schedule:
    - cron: '30 10 * * *' # cada día a las 10:30 UTC (la fuente de datos se actualiza hacia las 09:00 UTC)
  workflow_dispatch: # botón «Run workflow» para refrescar los datos a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Caché de todos los datos descargados. Cada ejecución guarda una versión nueva (clave con el id de ejecución)
      # y restaura la más reciente. «eur-» recoge la caché antigua de los precios en €.
      - uses: actions/cache@v4
        with:
          path: public/data
          key: data-${{ github.run_id }}
          restore-keys: |
            data-
            eur-

      - id: have
        run: |
          if [ -f public/data/leaders.json ] && [ -f public/data/cards.json ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi

      # Solo en la ejecución diaria o manual, o si no hay datos guardados todavía.
      - name: Descargar estadísticas, mazos y precios en $
        if: github.event_name != 'push' || steps.have.outputs.have != 'true'
        run: npm run sync

      # Precios en € de Cardmarket: incremental (solo pide las cartas con más de 3 días).
      - name: Descargar precios en €
        if: github.event_name != 'push' || steps.have.outputs.have != 'true'
        run: npm run sync:eur

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
